<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./css/site.css?v=20260830-1">
  <link rel="stylesheet" href="./css/pages/promotions.css?v=20260830-2">
  <script src="./js/admin-session.js?v=20260820-1"></script>
  <script src="./js/api-client.js?v=20260829-1"></script>
  <script defer src="./js/visit-tracking.js?v=20260831-1"></script>
  <script defer src="./js/admin-menu.js?v=20260830-1"></script>
  <script defer src="./js/pages/promotions.js?v=20260831-2"></script>
  <title>[FRJ] — Promotions et soldes</title>
</head>
<body class="discounts-page" data-visit-module="admin-discounts">
  <main class="discounts-admin">
    <header><h1>Promotions et soldes</h1><button id="reloadDiscounts" type="button">Recharger</button></header>
    <p id="discountStatus" role="status"></p>
    <section class="discount-panel">
      <h2>Génération automatique</h2>
      <form id="discountConfigForm">
        <label><input id="automaticPromotionsEnabled" type="checkbox"> Promotions quotidiennes automatiques</label>
        <label>Taux par défaut (%) <input id="defaultPromotionRate" type="number" min="0.01" max="100" step="0.01" required></label>
        <button type="submit">Enregistrer</button>
        <button id="generateDiscountNow" type="button">Compléter aujourd’hui et préparer demain</button>
      </form>
    </section>
    <section class="discount-panel">
      <h2>Ajouter une promotion</h2>
      <form id="dailyPromotionForm" class="discount-grid">
        <label>Date <input name="date" type="date" required></label>
        <label>Couple <select name="pair" required></select></label>
        <label>Taux (%) <input name="rate" type="number" value="5" min="0.01" max="100" step="0.01" required></label>
        <button type="submit">Ajouter</button>
      </form>
    </section>
    <section class="discount-panel">
      <h2>Ajouter des soldes</h2>
      <form id="saleForm" class="discount-grid">
        <label>Début <input name="startsOn" type="date" required></label>
        <label>Fin <input name="endsOn" type="date" required></label>
        <label>Taux (%) <input name="rate" type="number" value="5" min="0.01" max="100" step="0.01" required></label>
        <button type="submit">Ajouter</button>
      </form>
    </section>
    <section class="discount-panel"><h2>Campagnes</h2><div id="discountCampaigns"></div></section>
  </main>
</body>
</html>
