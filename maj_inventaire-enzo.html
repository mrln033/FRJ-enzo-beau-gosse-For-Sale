<!DOCTYPE html>
<html>
<head>
    <base target="_self">
	<link rel="icon" href="./favicon.ico">
	<link rel="stylesheet" href="./style.css?v=20260718-1">
	<link rel="stylesheet" href="./maj_css.css?v=20260718-1">
	<meta charset="UTF-8">
	<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
	<meta http-equiv="Pragma" content="no-cache">
	<meta http-equiv="Expires" content="0">
	<title>MAJ Inventaire</title>

</head>
<body>
<div class="nav-admin">
  <a href="maj_mu.html?admin=1" id="btnMU">MàJ MU</a>
  <a href="maj_inventaire-enzo.html?admin=1&amp;avatar=enzo&amp;v=20260718-1" id="btnINV-enzo" class="inventory-link">MàJ Inventaire<br>[enzo beau gosse]</a>
  <a href="maj_inventaire-enzo.html?admin=1&amp;avatar=arkaman&amp;v=20260718-1" id="btnINV-arkaman" class="inventory-link">MàJ Inventaire<br>[FRJ enzo ArkaMan]</a>
  <a href="maj_inventaire-enzo.html?admin=1&amp;avatar=kenza&amp;v=20260718-1" id="btnINV-kenza" class="inventory-link">MàJ Inventaire<br>[kenza la belle]</a>
  <a href="maj_inventaire-enzo.html?admin=1&amp;avatar=nocturnal&amp;v=20260718-1" id="btnINV-nocturnal" class="inventory-link">MàJ Inventaire<br>[Nocturnal enzo FRJ]</a>
</div>

    <div align="center"><h1 id="title"></h1></div>
    <hr>
<h2 id="subtitle"></h2>

<textarea id="csvInput"></textarea>
<br>
<button onclick="sendData()">Envoi</button>

<script>
  // 🔐 Vérification admin
  const params = new URLSearchParams(window.location.search);
  if (params.get("admin") !== "1") {
    window.location.href = "./";
  }

  const inventories = {
    enzo: { name: "enzo beau gosse", sheet: "Inventaire Enzo" },
    arkaman: { name: "FRJ enzo ArkaMan", sheet: "Inventaire ArkaMan" },
    kenza: { name: "kenza la belle", sheet: "Inventaire Kenza" },
    nocturnal: { name: "Nocturnal enzo FRJ", sheet: "Inventaire Nocturnal" }
  };

  // L'ancienne URL sans paramètre continue d'ouvrir l'inventaire d'enzo beau gosse.
  const requestedAvatar = params.get("avatar");
  const avatar = Object.prototype.hasOwnProperty.call(inventories, requestedAvatar)
    ? requestedAvatar
    : "enzo";
  const avatarConfig = inventories[avatar];
  const avatarName = avatarConfig.name;

  document.title = `MAJ Inventaire ${avatarName}`;
  document.getElementById("title").innerText = `[${avatarName}] = A VENDRE`;
  document.getElementById("subtitle").innerText = `MAJ Inventaire ${avatarName} (Admin)`;
  document.getElementById("csvInput").placeholder = `Colle ici le CSV de l'inventaire de : [${avatarName}] uniquement, issu du site de MA, non groupé par container...`;
  document.getElementById(`btnINV-${avatar}`).classList.add("active");


async function sendData() {
  const btn = document.querySelector("button");
  const csv = document.getElementById("csvInput").value;

  if (!csv.trim()) {
    alert("Vide !");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Envoi en cours...";

  const endpoint = "https://script.google.com/macros/s/AKfycbxD_sOPcjLT-eWPrDMfLgaSx16yAeH17SCd8xByP2faU24z8ge5AiAWOueVBRanHjGx/exec";

  try {
    // Vérifie la destination avant l'envoi pour éviter d'écraser la mauvaise feuille.
    const cacheBust = Date.now();
    const targetResponse = await fetch(`${endpoint}?action=inventoryTarget&avatar=${encodeURIComponent(avatar)}&_=${cacheBust}`, {
      cache: "no-store"
    });
    const target = await targetResponse.json();

    if (target.avatar !== avatar || target.sheet !== avatarConfig.sheet) {
      throw new Error(`Le script Google Apps Script ne cible pas ${avatarConfig.sheet}. Redéploie sa dernière version avant de recommencer.`);
    }

    const response = await fetch(`${endpoint}?type=inventory&avatar=${encodeURIComponent(avatar)}&_=${cacheBust}`, {
      method: "POST",
      cache: "no-store",
      body: csv
    });
    const res = await response.text();

    alert("✅ " + res);
    document.getElementById("csvInput").value = "";
  } catch (err) {
    alert("❌ " + err);
  } finally {
    btn.disabled = false;
    btn.innerText = "Envoi";
  }
}

</script>
</body>
</html>
