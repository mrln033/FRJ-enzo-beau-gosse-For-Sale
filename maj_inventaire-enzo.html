<!DOCTYPE html>
<html>
<head>
    <base target="_self">
	<link rel="icon" href="./favicon.ico">
	<link rel="stylesheet" href="./style.css">
	<link rel="stylesheet" href="./maj_css.css">
	<meta charset="UTF-8">
	<title>MAJ Inventaire</title>

</head>
<body>
<div class="nav-admin">
  <a href="maj_mu.html?admin=1" id="btnMU">MàJ MU</a>
  <a href="maj_inventaire-enzo.html?admin=1&amp;avatar=enzo" id="btnINV-enzo" class="inventory-link"><span>MàJ Inventaire</span><span>[enzo beau gosse]</span></a>
  <a href="maj_inventaire-enzo.html?admin=1&amp;avatar=arkaman" id="btnINV-arkaman" class="inventory-link"><span>MàJ Inventaire</span><span>[FRJ enzo ArkaMan]</span></a>
  <a href="maj_inventaire-enzo.html?admin=1&amp;avatar=kenza" id="btnINV-kenza" class="inventory-link"><span>MàJ Inventaire</span><span>[kenza la belle]</span></a>
  <a href="maj_inventaire-enzo.html?admin=1&amp;avatar=nocturnal" id="btnINV-nocturnal" class="inventory-link"><span>MàJ Inventaire</span><span>[Nocturnal enzo FRJ]</span></a>
</div>

    <div align="center"><h1 id="title"></h1></div>
    <hr>
<h2 id="subtitle"></h2>

<textarea id="csvInput"></textarea>
<br>
<button onclick="sendData()">Envoi</button>

<script>
  // 🔐 Vérification admin
  const params = new URLSearchParams(window.location.search);
  if (params.get("admin") !== "1") {
    window.location.href = "./";
  }

  const inventories = {
    enzo: "enzo beau gosse",
    arkaman: "FRJ enzo ArkaMan",
    kenza: "kenza la belle",
    nocturnal: "Nocturnal enzo FRJ"
  };

  // L'ancienne URL sans paramètre continue d'ouvrir l'inventaire d'enzo beau gosse.
  const requestedAvatar = params.get("avatar");
  const avatar = Object.prototype.hasOwnProperty.call(inventories, requestedAvatar)
    ? requestedAvatar
    : "enzo";
  const avatarName = inventories[avatar];

  document.title = `MAJ Inventaire ${avatarName}`;
  document.getElementById("title").innerText = `[${avatarName}] = A VENDRE`;
  document.getElementById("subtitle").innerText = `MAJ Inventaire ${avatarName} (Admin)`;
  document.getElementById("csvInput").placeholder = `Colle ici le CSV de l'inventaire de : [${avatarName}] uniquement, issu du site de MA, non groupé par container...`;
  document.getElementById(`btnINV-${avatar}`).classList.add("active");


function sendData() {
  const btn = document.querySelector("button");
  const csv = document.getElementById("csvInput").value;

  if (!csv.trim()) {
    alert("Vide !");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Envoi en cours...";

  const endpoint = "https://script.google.com/macros/s/AKfycbxDLU93_rtARjYZKi10BusFYpMcKVS4Qu4I4zIqH8wtsS43pXM3afqsMm6KADE-dbxg/exec";

  fetch(`${endpoint}?type=inventory&avatar=${encodeURIComponent(avatar)}`, {
    method: "POST",
    body: csv
  })
  .then(res => res.text())
  .then(res => {
    alert("✅ " + res);
    document.getElementById("csvInput").value = "";
  })
  .catch(err => {
    alert("❌ " + err);
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerText = "Envoi";
  });
}

</script>
</body>
</html>
