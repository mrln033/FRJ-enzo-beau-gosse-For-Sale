<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base target="_self">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./style.css?v=20260814-6">
  <script src="./js/api-client.js?v=20260814-6"></script>
  <script defer src="./js/admin-menu.js?v=20260814-5"></script>
  <title>[FRJ] — Demandes d'achat</title>
  <style>
    body { max-width: 1250px; margin: 0 auto; padding: 78px 18px 40px; box-sizing: border-box; }
    .orders-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .orders-header button { padding: 8px 13px; cursor: pointer; }
    .orders-summary { margin: 8px 0 20px; color: #5e5547; }
    .orders-list { display: grid; gap: 14px; }
    .order-card { padding: 15px; border: 1px solid #c9bfae; border-radius: 9px; background: #fffdf7; box-shadow: 0 2px 7px rgba(0,0,0,.08); }
    .order-card.awaiting-approval { border-color: #8b5cf6; box-shadow: 0 0 0 2px rgba(139,92,246,.12); }
    .order-card header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .order-card h2 { margin: 0 0 4px; font-size: 1.05rem; }
    .order-meta { display: flex; flex-wrap: wrap; gap: 7px 15px; font-size: .88rem; color: #675e51; }
    .order-card table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .order-card th, .order-card td { padding: 6px; border-bottom: 1px solid #e2dbcf; text-align: left; }
    .order-card th:not(:first-child), .order-card td:not(:first-child) { text-align: right; }
    .order-card tr.is-dirty td { background: #faf7ff; }
    .order-total { margin: 10px 0 0; text-align: right; font-size: 1.05rem; }
    .order-comment { margin: 10px 0 0; padding: 8px; background: #f1ece3; white-space: pre-wrap; }
    .order-status { padding: 6px; border-radius: 5px; }
    .line-editor { white-space: nowrap; }
    .line-editor > * + * { margin-left: 5px; }
    .line-editor input { width: 78px; padding: 5px; }
    .line-editor select, .line-editor button { padding: 5px; }
    .line-editor .markup-amount { width: 72px; }
    .approval-hint { margin: 10px 0 0; padding: 8px 10px; border-radius: 6px; color: #563a87; background: #eee7ff; font-weight: 700; }
    .order-save-row { display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 12px; }
    .order-save-row button { padding: 8px 13px; border: 1px solid #735117; border-radius: 6px; background: #d5aa54; cursor: pointer; font-weight: 800; }
    .order-save-row button:disabled { opacity: .5; cursor: default; }
    .order-dirty { color: #7045b2; font-size: .85rem; font-weight: 700; }
    .orders-error { color: #a02323; white-space: pre-line; }
    @media (max-width: 650px) {
      body { padding-top: 125px; }
      .order-card { overflow-x: auto; }
      .orders-header { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <section class="orders-header">
    <div>
      <h1>Demandes d'achat</h1>
      <p class="orders-summary" id="ordersSummary">Chargement…</p>
    </div>
    <button type="button" id="refreshOrders">Actualiser</button>
  </section>
  <p id="ordersError" class="orders-error" hidden></p>
  <main id="ordersList" class="orders-list"></main>

  <script>
    const STATUS_LABELS = {
      awaiting_approval: "À valider", submitted: "Transmise", viewed: "Vue", preparing: "À préparer",
      ready: "Prête", completed: "Terminée", cancelled: "Annulée", expired: "Expirée"
    };

    function formatDate(value) {
      if (!value) return "—";
      return new Date(value).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
    }

    function formatPed(value) {
      return Number(value || 0).toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function roundPed(value, decimals = 2) {
      const factor = 10 ** decimals;
      return Math.round((Number(value) + Number.EPSILON) * factor) / factor;
    }

    async function loadOrders() {
      const list = document.getElementById("ordersList");
      const summary = document.getElementById("ordersSummary");
      const error = document.getElementById("ordersError");
      summary.textContent = "Chargement…";
      error.hidden = true;
      try {
        const response = await FRJ_API.fetchD1Admin("/admin/orders", { cache: "no-store" });
        const report = await response.json();
        const orders = report.orders || [];
        summary.textContent = report.enabled === false
          ? "Fonction panier désactivée. Les demandes existantes sont conservées."
          : `${orders.length} demande(s) affichée(s) — actualisé ${formatDate(report.generatedAt)}`;
        list.replaceChildren(...orders.map(renderOrder));
        if (!orders.length && report.enabled !== false) {
          const empty = document.createElement("p");
          empty.textContent = "Aucune demande transmise.";
          list.appendChild(empty);
        }
      } catch (loadError) {
        list.replaceChildren();
        summary.textContent = "Chargement impossible";
        error.textContent = loadError.message;
        error.hidden = false;
      }
    }

    function renderOrder(order) {
      const article = document.createElement("article");
      article.className = `order-card${order.status === "awaiting_approval" ? " awaiting-approval" : ""}`;
      const header = document.createElement("header");
      const identity = document.createElement("div");
      const title = document.createElement("h2");
      title.textContent = `${order.publicReference} — ${order.buyerAvatar}`;
      const meta = document.createElement("div");
      meta.className = "order-meta";
      [
        formatDate(order.createdAt),
        order.sourceBackend === "gas-fallback" ? "Reçue par secours GAS" : "Reçue par D1",
        order.frjMember ? "Membre FRJ" : "Public",
        order.buyerContact || "Pas de contact"
      ].forEach((value) => {
        const span = document.createElement("span");
        span.textContent = value;
        meta.appendChild(span);
      });
      identity.append(title, meta);
      const select = document.createElement("select");
      select.className = "order-status";
      Object.entries(STATUS_LABELS).forEach(([value, label]) => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = label;
        option.selected = order.status === value;
        option.disabled = value === "awaiting_approval";
        select.appendChild(option);
      });
      select.addEventListener("change", () => updateStatus(order.id, select));
      header.append(identity, select);
      article.appendChild(header);
      if (order.status === "awaiting_approval") {
        const hint = document.createElement("p");
        hint.className = "approval-hint";
        hint.textContent = `Proposition n°${order.proposalVersion} en attente d’acceptation par le client.`;
        article.appendChild(hint);
      }

      const table = document.createElement("table");
      table.innerHTML = "<thead><tr><th>Article</th><th>Qté proposée</th><th>Prix affiché</th><th>MU ponctuel</th><th>Estimation vente</th></tr></thead>";
      const body = document.createElement("tbody");
      const editors = [];
      (order.items || []).forEach((item) => {
        const row = document.createElement("tr");
        [`${item.itemName} (${item.storage} · ${item.aisle})`].forEach((value) => {
          const cell = document.createElement("td");
          cell.textContent = value;
          row.appendChild(cell);
        });
        const quantityCell = document.createElement("td");
        const quantity = document.createElement("input");
        quantity.type = "number";
        quantity.min = "0.0001";
        quantity.max = "1000000";
        quantity.step = "0.0001";
        quantity.value = item.quantity;
        quantity.setAttribute("aria-label", `Quantité ${item.itemName}`);
        quantityCell.appendChild(quantity);
        const priceCell = document.createElement("td");
        priceCell.textContent = `${formatPed(item.unitTtPed)} PED`;
        const markupCell = document.createElement("td");
        markupCell.className = "line-editor";
        const kind = document.createElement("select");
        kind.setAttribute("aria-label", `Type de MU ${item.itemName}`);
        [["percent", "%"], ["ped", "PED"], ["none", "Aucun"]].forEach(([value, label]) => {
          const option = document.createElement("option");
          option.value = value;
          option.textContent = label;
          option.selected = item.markupKind === value;
          kind.appendChild(option);
        });
        const amount = document.createElement("input");
        amount.className = "markup-amount";
        amount.type = "number";
        amount.min = "0";
        amount.step = "0.01";
        amount.value = item.markupKind === "percent"
          ? Number(item.markupValue || 0) * 100
          : (item.markupKind === "ped" ? Number(item.markupValue || 0) : "");
        amount.disabled = item.markupKind === "none";
        amount.setAttribute("aria-label", `Valeur du MU ${item.itemName}`);
        kind.addEventListener("change", () => {
          amount.disabled = kind.value === "none";
          if (kind.value === "none") amount.value = "";
        });
        markupCell.append(kind, amount);
        const estimateCell = document.createElement("td");
        estimateCell.textContent = `${formatPed(item.lineSalePed)} PED`;
        row.append(quantityCell, priceCell, markupCell, estimateCell);
        body.appendChild(row);
        editors.push({ item, quantity, kind, amount, estimateCell, row });
      });
      table.appendChild(body);
      article.appendChild(table);
      const total = document.createElement("p");
      total.className = "order-total";
      total.textContent = `Estimation totale : ${formatPed(order.totalSalePed)} PED`;
      article.appendChild(total);
      const saveRow = document.createElement("div");
      saveRow.className = "order-save-row";
      const dirtyLabel = document.createElement("span");
      dirtyLabel.className = "order-dirty";
      const save = document.createElement("button");
      save.type = "button";
      save.textContent = "Enregistrer les modifications";
      save.disabled = true;
      saveRow.append(dirtyLabel, save);
      article.appendChild(saveRow);

      const readEditor = (editor) => {
        const quantity = Number(editor.quantity.value);
        const markupKind = editor.kind.value;
        const markupAmount = markupKind === "none" ? null : Number(editor.amount.value);
        const unitTt = Number(editor.item.unitTtPed || 0);
        const valid = Number.isFinite(quantity) && quantity > 0
          && (markupKind === "none" || (Number.isFinite(markupAmount) && markupAmount >= 0));
        let unitSale = unitTt;
        if (valid && markupKind === "percent") unitSale = unitTt * (markupAmount / 100);
        if (valid && markupKind === "ped") unitSale = unitTt + markupAmount;
        const lineSale = valid ? roundPed(unitSale * quantity) : null;
        const originalAmount = editor.item.markupKind === "percent"
          ? Number(editor.item.markupValue || 0) * 100
          : (editor.item.markupKind === "ped" ? Number(editor.item.markupValue || 0) : null);
        const dirty = valid && (
          Math.abs(quantity - Number(editor.item.quantity)) > 0.0001
          || markupKind !== editor.item.markupKind
          || (markupKind !== "none" && Math.abs(markupAmount - originalAmount) > 0.0001)
        );
        return { lineNo: editor.item.lineNo, quantity, markupKind, markupAmount, lineSale, valid, dirty };
      };
      const recalculate = () => {
        const values = editors.map(readEditor);
        editors.forEach((editor, index) => {
          editor.estimateCell.textContent = values[index].valid ? `${formatPed(values[index].lineSale)} PED` : "—";
          editor.row.classList.toggle("is-dirty", values[index].dirty);
        });
        const valid = values.every((value) => value.valid);
        const dirtyCount = values.filter((value) => value.dirty).length;
        const totalValue = valid ? roundPed(values.reduce((sum, value) => sum + value.lineSale, 0)) : null;
        total.textContent = valid ? `Estimation totale : ${formatPed(totalValue)} PED` : "Estimation totale : —";
        dirtyLabel.textContent = dirtyCount ? `${dirtyCount} ligne(s) modifiée(s)` : "";
        save.disabled = !valid || dirtyCount === 0;
        return values;
      };
      editors.forEach((editor) => {
        editor.quantity.addEventListener("input", recalculate);
        editor.amount.addEventListener("input", recalculate);
        editor.kind.addEventListener("change", recalculate);
      });
      save.addEventListener("click", () => updateProposal(order.id, recalculate(), save));
      recalculate();
      if (order.buyerComment) {
        const comment = document.createElement("p");
        comment.className = "order-comment";
        comment.textContent = order.buyerComment;
        article.appendChild(comment);
      }
      return article;
    }

    async function updateStatus(id, select) {
      select.disabled = true;
      try {
        await FRJ_API.fetchD1Admin(`/admin/orders/${encodeURIComponent(id)}/status`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: select.value })
        });
        await loadOrders();
      } catch (error) {
        alert(error.message);
        await loadOrders();
      } finally {
        select.disabled = false;
      }
    }

    async function updateProposal(orderId, items, save) {
      save.disabled = true;
      save.textContent = "Enregistrement…";
      try {
        await FRJ_API.fetchD1Admin(`/admin/orders/${encodeURIComponent(orderId)}/proposal`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ items: items.map(({ lineNo, quantity, markupKind, markupAmount }) => ({
            lineNo, quantity, markupKind, markupAmount
          })) })
        });
        await loadOrders();
      } catch (error) {
        alert(error.message);
        save.disabled = false;
        save.textContent = "Enregistrer les modifications";
      }
    }

    document.getElementById("refreshOrders").addEventListener("click", loadOrders);
    loadOrders();
  </script>
</body>
</html>
