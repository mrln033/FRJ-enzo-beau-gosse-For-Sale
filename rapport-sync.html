<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_self">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="icon" href="./favicon.ico">
  <link rel="stylesheet" href="./style.css?v=20260813-3">
  <link rel="stylesheet" href="./maj_css.css?v=20260813-2">
  <script src="./js/api-client.js?v=20260813-5"></script>
  <script defer src="./js/admin-menu.js?v=20260813-2"></script>
  <title>Rapport de synchronisation GAS ↔ D1</title>
</head>
<body class="sync-report-page">
  <main class="sync-report">
    <header class="sync-report-header">
      <div>
        <h1>Rapport de synchronisation GAS ↔ D1</h1>
        <p>Journal centralisé D1 des synchronisations et audits exécutés par GAS.</p>
      </div>
      <div class="sync-report-actions">
        <button type="button" id="refreshReport">Actualiser</button>
        <button type="button" id="clearReportToken" class="secondary">Oublier le jeton</button>
      </div>
    </header>

    <div id="reportLoading" class="report-message">Chargement du rapport…</div>
    <div id="reportError" class="report-message error" hidden></div>

    <section id="reportContent" hidden>
      <div class="sync-summary" id="syncSummary"></div>

      <section class="report-panel">
        <h2>État des bases</h2>
        <div class="report-table-wrap">
          <table>
            <thead>
              <tr>
                <th>Dataset</th>
                <th>Lignes</th>
                <th>Origine active</th>
                <th>Date source</th>
                <th>Dernier contrôle</th>
                <th>Résultat</th>
              </tr>
            </thead>
            <tbody id="datasetRows"></tbody>
          </table>
        </div>
      </section>

      <section class="report-panel">
        <h2>Derniers événements</h2>
        <div class="report-table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date</th>
                <th>Dataset</th>
                <th>Direction</th>
                <th>Action</th>
                <th>Détails</th>
              </tr>
            </thead>
            <tbody id="eventRows"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script>
    const reportParams = new URLSearchParams(window.location.search);
    if (reportParams.get("admin") !== "1") window.location.replace("./");

    const dateFormatter = new Intl.DateTimeFormat("fr-FR", {
      dateStyle: "short",
      timeStyle: "medium",
      timeZone: "Europe/Paris"
    });

    document.getElementById("refreshReport").addEventListener("click", loadSyncReport);
    document.getElementById("clearReportToken").addEventListener("click", () => {
      FRJ_API.clearAdminToken();
      loadSyncReport();
    });

    function formatDate(value) {
      if (!value) return "—";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? String(value) : dateFormatter.format(date);
    }

    function actionLabel(action) {
      const labels = {
        "verified": "Identique — vérifié",
        "reconciled": "Réconcilié",
        "snapshot-imported": "Snapshot enregistré",
        "sync-run-completed": "Synchronisation terminée",
        "sync-run-failed": "Échec de synchronisation"
      };
      return labels[action] || action || "—";
    }

    function appendCell(row, value, className = "") {
      const cell = document.createElement("td");
      cell.textContent = value;
      if (className) cell.className = className;
      row.appendChild(cell);
    }

    function renderSummary(report) {
      const summary = document.getElementById("syncSummary");
      summary.replaceChildren();
      const cards = [
        [
          "État global",
          report.status === "error" ? "Erreur" : (report.status === "pending" ? "En attente du prochain trigger" : "Opérationnel"),
          report.status
        ],
        ["Datasets suivis", String(report.datasets.length), ""],
        ["Dernière exécution GAS", formatDate(report.system?.createdAt), ""],
        ["Rapport généré", formatDate(report.generatedAt), ""]
      ];
      cards.forEach(([label, value, status]) => {
        const card = document.createElement("article");
        card.className = `summary-card${status ? ` ${status}` : ""}`;
        const title = document.createElement("span");
        title.textContent = label;
        const content = document.createElement("strong");
        content.textContent = value;
        card.append(title, content);
        summary.appendChild(card);
      });
    }

    function renderDatasets(datasets) {
      const body = document.getElementById("datasetRows");
      body.replaceChildren();
      datasets.forEach((dataset) => {
        const row = document.createElement("tr");
        appendCell(row, dataset.dataset);
        appendCell(row, String(dataset.rowCount));
        appendCell(row, String(dataset.origin || "—").toUpperCase());
        appendCell(row, formatDate(dataset.updatedAt));
        appendCell(row, formatDate(dataset.lastAudit?.createdAt));
        appendCell(row, actionLabel(dataset.lastAudit?.action), dataset.lastAudit?.action === "sync-run-failed" ? "status-error" : "");
        body.appendChild(row);
      });
    }

    function renderEvents(events) {
      const body = document.getElementById("eventRows");
      body.replaceChildren();
      events.forEach((event) => {
        const row = document.createElement("tr");
        appendCell(row, formatDate(event.createdAt));
        appendCell(row, event.dataset);
        appendCell(row, event.direction || "—");
        appendCell(row, actionLabel(event.action), event.action === "sync-run-failed" ? "status-error" : "");
        appendCell(row, event.details ? JSON.stringify(event.details) : "—", "event-details");
        body.appendChild(row);
      });
    }

    async function loadSyncReport() {
      const loading = document.getElementById("reportLoading");
      const error = document.getElementById("reportError");
      const content = document.getElementById("reportContent");
      loading.hidden = false;
      error.hidden = true;
      try {
        const response = await FRJ_API.fetchD1Admin("/admin/sync-report?limit=100", { cache: "no-store" });
        const report = await response.json();
        renderSummary(report);
        renderDatasets(report.datasets || []);
        renderEvents(report.events || []);
        content.hidden = false;
      } catch (loadError) {
        content.hidden = true;
        error.textContent = loadError.message;
        error.hidden = false;
      } finally {
        loading.hidden = true;
      }
    }

    loadSyncReport();
  </script>
</body>
</html>
