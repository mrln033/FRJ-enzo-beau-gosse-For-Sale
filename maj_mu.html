    <div align="center"><h1 id="title">[FRJ] - Mise à Jour des MarkUp</h1></div>
    <hr>
<h2 id="subtitle">MAJ MU (Admin)</h2>

<textarea id="csvInput" placeholder="Colle ton CSV ici..."></textarea>
<br>
<button onclick="sendData()">Envoi</button>

<script>
  // 🔐 Vérification admin
  const params = new URLSearchParams(window.location.search);
  if (params.get("admin") !== "1") {
    window.location.href = "./";
  }



async function sendData() {
  const btn = document.querySelector("button");
  const csv = document.getElementById("csvInput").value;

  if (!csv.trim()) {
    alert("Vide !");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Envoi en cours...";

  try {
    const outcome = await FRJ_API.importToBoth("?type=mu", {
      method: "POST",
      body: csv
    }, {
      dataset: "mu"
    });
    alert(formatImportOutcome(outcome));
    if (outcome.ok) document.getElementById("csvInput").value = "";
  } catch (err) {
    alert("❌ " + err);
  } finally {
    btn.disabled = false;
    btn.innerText = "Envoi";
  }
}

function formatImportOutcome(outcome) {
  const lines = outcome.results.map((result) => {
    const label = result.backend === "gas" ? "GAS" : "D1";
    const warning = result.warning ? `\n   ⚠️ ${result.warning}` : "";
    return `${result.ok ? "✅" : "❌"} ${label} : ${result.message}${warning}`;
  });
  if (outcome.partial) {
    lines.unshift("⚠️ Import partiel : la base disponible a été mise à jour.");
    lines.push("La synchronisation contrôlera et réparera l'autre base dès qu'elle sera accessible.");
  } else if (!outcome.ok) {
    lines.unshift("❌ L'import a échoué sur les deux bases. Le CSV est conservé.");
  }
  return lines.join("\n");
}

</script>
<script>
  const path = window.location.pathname;

  if (path.includes("maj_mu")) {
    document.getElementById("btnMU").classList.add("active");
  }

  document.getElementById("subtitle").innerText += " — GAS + D1";

</script>
