    <div align="center"><h1 id="title">[FRJ] - Mise à Jour des MarkUp</h1></div>
    <hr>
<h2 id="subtitle">MAJ MU (Admin)</h2>

<textarea id="csvInput" placeholder="Colle ton CSV ici..."></textarea>
<br>
<button onclick="sendData()">Envoi</button>

<script>
  // 🔐 Vérification admin
  const params = new URLSearchParams(window.location.search);
  if (params.get("admin") !== "1") {
    window.location.href = "./";
  }



async function sendData() {
  const btn = document.querySelector("button");
  const csv = document.getElementById("csvInput").value;

  if (!csv.trim()) {
    alert("Vide !");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Envoi en cours...";

  try {
    const response = await FRJ_API.fetch("?type=mu", {
      method: "POST",
      body: csv
    });
    const res = await response.text();
    let syncWarning = "";
    if (FRJ_API.backend === "gas") {
      try {
        await FRJ_API.requestSynchronization("mu", "import-gas-mu");
      } catch (syncError) {
        syncWarning = `\n⚠️ Import effectué, mais demande de synchronisation non enregistrée : ${syncError.message || syncError}`;
      }
    }
    alert("✅ " + res + syncWarning);
    document.getElementById("csvInput").value = "";
  } catch (err) {
    alert("❌ " + err);
  } finally {
    btn.disabled = false;
    btn.innerText = "Envoi";
  }
}

</script>
<script>
  const path = window.location.pathname;

  if (path.includes("maj_mu")) {
    document.getElementById("btnMU").classList.add("active");
  }

  document.getElementById("subtitle").innerText += ` — ${FRJ_API.label}`;
  FRJ_API.preserveBackendInAdminLinks();

</script>
</body>
