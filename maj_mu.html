    <div align="center"><h1 id="title">[FRJ] - Mise à Jour des MarkUp</h1></div>
    <hr>
<h2>MAJ MU (Admin)</h2>

<textarea id="csvInput" placeholder="Colle ton CSV ici..."></textarea>
<br>
<button onclick="sendData()">Envoi</button>

<script>
  // 🔐 Vérification admin
  const params = new URLSearchParams(window.location.search);
  if (params.get("admin") !== "1") {
    window.location.href = "./";
  }



function sendData() {
  const btn = document.querySelector("button");
  const csv = document.getElementById("csvInput").value;

  if (!csv.trim()) {
    alert("Vide !");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Envoi en cours...";

  fetch("https://script.google.com/macros/s/AKfycbxD_sOPcjLT-eWPrDMfLgaSx16yAeH17SCd8xByP2faU24z8ge5AiAWOueVBRanHjGx/exec?type=mu", {
    method: "POST",
    body: csv
  })
  .then(res => res.text())
  .then(res => {
    alert("✅ " + res);
    document.getElementById("csvInput").value = "";
  })
  .catch(err => {
    alert("❌ " + err);
  })
  .finally(() => {
    btn.disabled = false;
    btn.innerText = "Envoi";
  });
}

</script>
<script>
  const path = window.location.pathname;

  if (path.includes("maj_mu")) {
    document.getElementById("btnMU").classList.add("active");
  }

</script>
</body>
